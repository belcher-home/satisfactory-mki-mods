[AccessTransformers]
; Terrain mode clears the vanilla dismantle aim (SetAimedAtActor, ClearPendingSelectedActors) when it takes over the gun.
Friend=(Class="UFGBuildGunStateDismantle", FriendClass="FMKITerrainDismantle")
; Area mode (#402) clears the vanilla aim the same way and sends its selection to the game's own dismantle
; (Server_DismantleActors, private); its mode descriptor sets the multi-dismantle limit (mMultiDismantleLimit, private).
Friend=(Class="UFGBuildGunStateDismantle", FriendClass="FMKIAreaDismantle")
Friend=(Class="UFGDismantleModeDescriptor", FriendClass="UMKIAreaDismantleMode")
; Dismantle unused supports hooks the state's server dismantle and refund preview (Server_DismantleActors_Implementation,
; Server_PeekAtDismantleRefund_Implementation, private), and outlines from its aim, selection and mode (mCurrentlySelectedActor,
; mPendingDismantleActors, mDefaultDismantleMode, private).
Friend=(Class="UFGBuildGunStateDismantle", FriendClass="FMKIToolsModule")
Friend=(Class="UFGBuildGunStateDismantle", FriendClass="FMKIOrphanSupports")
; Auto pickup picks through the game's own foliage pickup proxy (DoPickup, mPickupRepeatInterval), as a press of E does.
Friend=(Class="AFGFoliagePickup", FriendClass="UMKIAutoPickupSubsystem")
; Chainsaw cuts boulders: the module hooks the chainsaw's server-side foliage removal (protected) to give limestone.
Friend=(Class="AFGChainsaw", FriendClass="FMKIToolsModule")
; Hand crafting speed logs the Craft Bench timings (mHoldProduceTime, mRecipeDuration, mCooldownDelay).
Friend=(Class="UFGWorkBench", FriendClass="FMKIToolsModule")
; Hand mining speed hooks the hand miner's reward (Server_GiveMiningRewards_Implementation, protected).
Friend=(Class="AFGResourceMiner", FriendClass="FMKIToolsModule")
; Health regeneration speed and extra inventory slots hook TickHealthGeneration and GetTotalPlayerInventorySlots (private).
Friend=(Class="AFGCharacterPlayer", FriendClass="FMKIToolsModule")
Friend=(Class="AFGCharacterPlayer", FriendClass="AMKIPlayerSubsystem")
; Collect nearby items picks foliage and ground items through the proxy (DoPickup), as auto pickup does.
Friend=(Class="AFGFoliagePickup", FriendClass="UMKICollectNearbySubsystem")
; Short conveyor lifts lowers the lift hologram's shortest height (mMinimumHeight) before UpdateTopTransform (both protected).
Friend=(Class="AFGConveyorLiftHologram", FriendClass="FMKIToolsModule")
; Movement speed bonus scales the hover pack's speeds (mHoverSpeed, mHoverAccelerationSpeed, private) through a hover step,
; wraps the movement component's custom physics (PhysCustom, protected; GetCachedHoverPack, private) and reads its vanilla
; vertical flying speeds (private); flight at ground speed reads the equipped Blade Runners (GetCachedJumpingStilts, private).
Friend=(Class="AFGHoverPack", FriendClass="FMKIToolsModule")
Friend=(Class="UFGCharacterMovementComponent", FriendClass="FMKIToolsModule")
; Terrain mode breaks a nobelisk-destructible rock; if the blast leaves it intact it sets the broken state itself
; (SetDestructibleActorState, mDestroyedByForceLocation, protected).
Friend=(Class="AFGDestructibleActor", FriendClass="AMKITerrainSubsystem")
; Elevation and length readouts show the power line hologram's own length (GetLength, mCurrentConnection, private).
Friend=(Class="AFGWireHologram", FriendClass="UMKIHudReadoutsSubsystem")
; Object scanner range bonus scales the scanner's detection range (mDetectionRange, protected) and logs its beep delays.
Friend=(Class="AFGObjectScanner", FriendClass="FMKIToolsModule")
; Foundation area zoop clears the foundation hologram's line-only zoop (mOnlyAllowLineZoop) before its zoop update
; (SetZoopFromHitresult), reads its size and vertical zoop mode (mWidth, mDepth, mBuildModeVerticalZoop, all protected),
; and sets the zoop (mDesiredZoop) within the blocked directions (mBlockedZoopDirectionMask), both private.
Friend=(Class="AFGFoundationHologram", FriendClass="FMKIToolsModule")
Friend=(Class="AFGBuildableHologram", FriendClass="FMKIToolsModule")
; Foundation area zoop's HUD count reads the hologram's zoop (mDesiredZoop, private).
Friend=(Class="AFGBuildableHologram", FriendClass="UMKIAreaZoopLabelSubsystem")
; Options > MKI Tools builds the game's own settings in code (the game gathers them from cooked assets only): it shows them in
; shipped builds (UFGUserSetting::ShowInBuilds, protected) and adds them to the game's user settings (mUserSettings, private).
Friend=(Class="UFGUserSetting", FriendClass="UMKIToolsOptionsMenu")
Friend=(Class="UFGGameUserSettings", FriendClass="UMKIToolsOptionsMenu")
